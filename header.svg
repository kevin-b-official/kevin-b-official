<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="100%" height="260">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#140b1e" />
      <stop offset="55%" stop-color="#2b123a" />
      <stop offset="100%" stop-color="#4a1d4c" />
    </linearGradient>

    
    <g id="sakura-petal">
      <rect x="16" y="0" width="16" height="8" fill="#ffb7d5" />
      <rect x="8" y="8" width="32" height="8" fill="#ff9ebb" />
      <rect x="0" y="16" width="48" height="8" fill="#ff85ad" />
      <rect x="8" y="24" width="32" height="8" fill="#f472b6" />
      <rect x="16" y="32" width="16" height="8" fill="#db2777" />
      <rect x="20" y="16" width="8" height="8" fill="#ffe4ef" />
    </g>

    <style>
      .petal {
        animation-name: fallAndDrift;
        animation-timing-function: linear;
        animation-iteration-count: infinite;
      }
      .p1 { animation-duration: 7.5s; animation-delay: 0s; }
      .p2 { animation-duration: 9.0s; animation-delay: -1.8s; }
      .p3 { animation-duration: 6.8s; animation-delay: -3.2s; }
      .p4 { animation-duration: 8.4s; animation-delay: -4.5s; }
      .p5 { animation-duration: 10.2s; animation-delay: -2.1s; }
      .p6 { animation-duration: 7.9s; animation-delay: -5.4s; }
      .p7 { animation-duration: 8.8s; animation-delay: -1.1s; }
      .p8 { animation-duration: 6.5s; animation-delay: -3.9s; }

      @keyframes fallAndDrift {
        0% {
          transform: translate(0px, -40px) rotate(0deg);
          opacity: 0;
        }
        12% {
          opacity: 0.95;
        }
        50% {
          transform: translate(-45px, 120px) rotate(18deg);
          opacity: 0.9;
        }
        88% {
          opacity: 0.9;
        }
        100% {
          transform: translate(-90px, 275px) rotate(-14deg);
          opacity: 0;
        }
      }
    </style>
  </defs>

  
  <rect width="1200" height="260" fill="url(#sky)" />

  
  <rect x="960" y="34" width="48" height="48" fill="#fff1f2" />
  <rect x="952" y="42" width="8" height="32" fill="#ffe4e6" />
  <rect x="1008" y="42" width="8" height="32" fill="#ffe4e6" />
  <rect x="968" y="26" width="32" height="8" fill="#ffe4e6" />
  <rect x="968" y="82" width="32" height="8" fill="#ffe4e6" />

  
  <path d="M0 215 L180 140 L340 190 L540 125 L760 205 L1200 155 L1200 260 L0 260 Z" fill="#1b0d26" />
  <path d="M0 232 L260 175 L520 220 L840 165 L1200 210 L1200 260 L0 260 Z" fill="#12081a" />

  
  <g fill="#2e1338">
    <rect x="85" y="168" width="68" height="8" />
    <rect x="91" y="178" width="56" height="6" />
    <rect x="101" y="184" width="8" height="46" />
    <rect x="129" y="184" width="8" height="46" />
    <rect x="115" y="196" width="8" height="6" />
  </g>

  
  <text x="600" y="92" text-anchor="middle" fill="#f9a8d4" font-size="20" font-family="&#39;Hiragino Kaku Gothic ProN&#39;, &#39;Yu Gothic&#39;, &#39;Meiryo&#39;, monospace" letter-spacing="8">
    地平線 · ホライズン
  </text>
  <text x="600" y="142" text-anchor="middle" fill="#ffffff" font-size="48" font-weight="700" font-family="&#39;Courier New&#39;, Courier, monospace" letter-spacing="6">
    HORIZON
  </text>
  <text x="600" y="176" text-anchor="middle" fill="#fbcfe8" font-size="15" font-family="&#39;Courier New&#39;, Courier, monospace" letter-spacing="2">
    PIXEL CRAFTED SOFTWARE &amp; SYSTEMS // SAKURA EDITION
  </text>

  
  <g class="petal p1"><use href="#sakura-petal" x="180" y="0" transform="scale(0.65)" /></g>
  <g class="petal p2"><use href="#sakura-petal" x="420" y="0" transform="scale(0.55)" /></g>
  <g class="petal p3"><use href="#sakura-petal" x="680" y="0" transform="scale(0.70)" /></g>
  <g class="petal p4"><use href="#sakura-petal" x="920" y="0" transform="scale(0.50)" /></g>
  <g class="petal p5"><use href="#sakura-petal" x="1180" y="0" transform="scale(0.60)" /></g>
  <g class="petal p6"><use href="#sakura-petal" x="1420" y="0" transform="scale(0.55)" /></g>
  <g class="petal p7"><use href="#sakura-petal" x="1680" y="0" transform="scale(0.65)" /></g>
  <g class="petal p8"><use href="#sakura-petal" x="1920" y="0" transform="scale(0.50)" /></g>
</svg>